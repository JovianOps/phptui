name: PhpTui CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: php -l src/phptui.php
      - run: php tests/smoke.php
